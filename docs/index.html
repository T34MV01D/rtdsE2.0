<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sigma Bundler</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon.svg">
    <style>@font-face {
    font-family: skibidi;
    src: url("./font.ttf");
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0e11;
    color: #fff;
    font-family: "skibidi", sans-serif;
}

header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem;
    border-bottom: 1px solid #222;
    position: sticky;
    top: 0;
    background: #0b0e11;
    z-index: 100;
}

header a {
    text-decoration: none;
    color: inherit;
}

header a:hover {
    color: lightblue;
}

.logo {
    width: 3rem;
    height: 3rem;
    object-fit: contain;
}

header h1 {
    margin: 0;
    font-size: 1.5rem;
    white-space: nowrap;
}

#search {
    width: min(100%, 24rem);
    margin-left: auto;
    padding: 0.7rem 1rem;
    border: 1px solid #333;
    border-radius: 0.4rem;
    background: #161b22;
    color: #fff;
}

#search::placeholder {
    color: #999;
}

#search:focus {
    outline: 2px solid #fff;
    outline-offset: 2px;
}

#container {
    padding: 1rem;
    margin: 0 auto;
}

.catalog-section {
    margin-bottom: 2.5rem;
}

.section-heading {
    font-size: 1.3rem;
    margin: 0 0 1rem 0.5rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid #222;
    color: #ccc;
    letter-spacing: 0.05em;
}

/* Dim out the archive section slightly to show lower support */
.section-archive .section-heading {
    color: #777;
}
.section-archive .game-card {
    opacity: 0.5;
    border-color: #1a1a1a;
}
.section-archive .game-card:hover {
    opacity: 1;
}

.section-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1rem;
}

.game-card {
    display: block;
    min-width: 0;
    color: inherit;
    text-decoration: none;
    border: 2px solid #222;
    background: #161b22;
    text-align: center;
    border-radius: 6px;
    transition: transform 0.2s, border-color 0.2s, opacity 0.2s;
}

.section-featured .game-card .game-card-title {
    color: lime;
    font-weight: bold;
}

.game-card:hover {
    transform: translateY(-4px);
    border-color: #fff !important;
}

.game-card-image {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: #161b22;
}

.game-card-title {
    display: block;
    padding: 0.5rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 1.1rem;
}

@media (max-width: 600px) {
    header {
        flex-wrap: wrap;
    }
    #search {
        width: 100%;
        margin-left: 0;
        order: 3;
    }
}</style>
</head>
<body>
    <header title="on chromebooks, if you press ctrl+shift+u, then let go and type 1d6ba and press space/enter, you will get a mathematical bold capital sigma.">
        <img src="icon2.svg" alt="Sigma Bundler Logo" class="logo">
        <h1><a href="#" onclick="alert('𝚺')">Sigma Bundler</a> | <a href="bit.ly/sigmabundler">bit.ly/sigmabundler</a> | <a href="https://github.com/sigmiliarity" target="_blank">GitHub</a></h1>
        <input type="text" id="search" placeholder="Search games... (/, ESC)" autocomplete="off" spellcheck="false">
    </header>

    <template id="game-template">
        <a class="game-card" target="_blank">
            <img class="game-card-image" loading="lazy" decoding="async">
            <span class="game-card-title"></span>
        </a>
    </template>

    <div id="container"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
