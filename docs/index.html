<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sigma Bundler</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon.svg">
    <style>@font-face {
    font-family: skibidi;
    src: url("./font.ttf");
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0e11;
    color: #fff;
    font-family: "skibidi", sans-serif;
}

header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem;
    border-bottom: 1px solid #222;
    position: sticky;
    top: 0;
    background: #0b0e11;
    z-index: 100;
}

header a {
    text-decoration: none;
    color: inherit;
}

header a:hover {
    color: lightblue;
}

.logo {
    width: 3rem;
    height: 3rem;
    object-fit: contain;
}

header h1 {
    margin: 0;
    font-size: 1.5rem;
    white-space: nowrap;
}

#search {
    width: min(100%, 24rem);
    margin-left: auto;
    padding: 0.7rem 1rem;
    border: 1px solid #333;
    border-radius: 0.4rem;
    background: #161b22;
    color: #fff;
}

#search::placeholder {
    color: #999;
}

#search:focus {
    outline: 2px solid #fff;
    outline-offset: 2px;
}

#container {
    padding: 1rem;
    margin: 0 auto;
}

.catalog-section {
    margin-bottom: 2.5rem;
}

.section-heading {
    font-size: 1.3rem;
    margin: 0 0 1rem 0.5rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid #222;
    color: #ccc;
    letter-spacing: 0.05em;
}

/* Dim out the archive section slightly to show lower support */
.section-archive .section-heading {
    color: #777;
}
.section-archive .game-card {
    opacity: 0.5;
    border-color: #1a1a1a;
}
.section-archive .game-card:hover {
    opacity: 1;
}

.section-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1rem;
}

.game-card {
    display: block;
    min-width: 0;
    color: inherit;
    text-decoration: none;
    border: 2px solid #222;
    background: #161b22;
    text-align: center;
    border-radius: 6px;
    transition: transform 0.2s, border-color 0.2s, opacity 0.2s;
}

.section-featured .game-card .game-card-title {
    color: lime;
    font-weight: bold;
}

.game-card:hover {
    transform: translateY(-4px);
    border-color: #fff !important;
}

.game-card-image {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: #161b22;
}

.game-card-title {
    display: block;
    padding: 0.5rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 1.1rem;
}

@media (max-width: 600px) {
    header {
        flex-wrap: wrap;
    }
    #search {
        width: 100%;
        margin-left: 0;
        order: 3;
    }
}</style>
</head>
<body>
    <header title="on chromebooks, if you press ctrl+shift+u, then let go and type 1d6ba and press space/enter, you will get a mathematical bold capital sigma.">
        <img src="icon2.svg" alt="Sigma Bundler Logo" class="logo">
        <h1><a href="#" onclick="alert('𝚺')">Sigma Bundler</a> | <a href="bit.ly/sigmabundler">bit.ly/sigmabundler</a> | <a href="https://github.com/sigmiliarity" target="_blank">GitHub</a></h1>
        <input type="text" id="search" placeholder="Search games... (/, ESC)" autocomplete="off" spellcheck="false">
    </header>

    <template id="game-template">
        <a class="game-card" target="_blank">
            <img class="game-card-image" loading="lazy" decoding="async">
            <span class="game-card-title"></span>
        </a>
    </template>

    <div id="container"></div>

    <script type="module" src="script.js"></script>
</body>
    <script>const CATEGORIES = [
    { key: "featured", title: "Featured" },
    { key: "default", title: "Games" },
    { key: "archive", title: "Archive (Unsupported)" }
];

async function loadCatalog() {
    const entries = await Promise.all(
        CATEGORIES.map(async ({ key, title }) => {
            try {
                const response = await fetch(`/data/${key}.json`);
                if (!response.ok) return [key, title, []];
                const data = await response.json();
                const sorted = data.sort((a, b) => a[0].localeCompare(b[0]));
                return [key, title, sorted];
            } catch {
                return [key, title, []];
            }
        })
    );
    return entries; // Returns map of [key, title, games[]]
}

function loadUI(catalog) {
    const container = document.getElementById("container");
    const template = document.getElementById("game-template");

    function render(filteredCatalog) {
        container.replaceChildren();

        for (const [key, title, games] of filteredCatalog) {
            if (games.length === 0) continue;

            const section = document.createElement("section");
            section.className = `catalog-section section-${key}`;

            const heading = document.createElement("h2");
            heading.className = "section-heading";
            heading.textContent = title;
            section.appendChild(heading);

            const grid = document.createElement("div");
            grid.className = "section-grid";

            const fragment = document.createDocumentFragment();
            for (const [gameTitle, url, image] of games) {
                const card = template.content.cloneNode(true);
                const link = card.querySelector(".game-card");
                link.href = url;
                link.title = gameTitle;

                const img = card.querySelector(".game-card-image");
                img.src = image;
                img.alt = gameTitle;

                card.querySelector(".game-card-title").textContent = gameTitle;

                fragment.append(card);
            }

            grid.append(fragment);
            section.append(grid);
            container.append(section);
        }
    }

    render(catalog);

    return {
        filter(searchTerm) {
            if (!searchTerm) {
                render(catalog);
                return;
            }

            const filtered = catalog.map(([key, title, games]) => {
                const matched = games.filter(([gameTitle]) =>
                    gameTitle.toLowerCase().includes(searchTerm)
                );
                return [key, title, matched];
            });

            render(filtered);
        }
    };
}

function setupSearch(ui) {
    const searchInput = document.getElementById("search");

    searchInput.addEventListener("input", () => {
        ui.filter(searchInput.value.trim().toLowerCase());
    });

    window.addEventListener("keydown", (e) => {
        if (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
            e.preventDefault();
            searchInput.focus();
        }
        if (e.key === "Escape") {
            searchInput.value = "";
            ui.filter("");
            searchInput.blur();
        }
    });
}

const catalog = await loadCatalog();

console.log(catalog);

const ui = loadUI(catalog);
setupSearch(ui);</script>
</html>
