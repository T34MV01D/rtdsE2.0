    <style>
        @font-face {
    font-family: skibidi;
    src: url("./font.ttf");
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0e11;
    color: #fff;
    font-family: "skibidi", sans-serif;
}

header {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem;
    border-bottom: 1px solid #222;
    position: sticky;
    top: 0;
    background: #0b0e11;
    z-index: 100;
}

header a {
    text-decoration: none;
    color: inherit;
}

header a:hover {
    color: lightblue;
}

.logo {
    width: 3rem;
    height: 3rem;
    object-fit: contain;
}

header h1 {
    margin: 0;
    font-size: 1.5rem;
    white-space: nowrap;
}

#search {
    width: min(100%, 24rem);
    margin-left: auto;
    padding: 0.7rem 1rem;
    border: 1px solid #333;
    border-radius: 0.4rem;
    background: #161b22;
    color: #fff;
}

#search::placeholder {
    color: #999;
}

#search:focus {
    outline: 2px solid #fff;
    outline-offset: 2px;
}

#container {
    padding: 1rem;
    margin: 0 auto;
}

.catalog-section {
    margin-bottom: 2.5rem;
}

.section-heading {
    font-size: 1.3rem;
    margin: 0 0 1rem 0.5rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid #222;
    color: #ccc;
    letter-spacing: 0.05em;
}

/* Dim out the archive section slightly to show lower support */
.section-archive .section-heading {
    color: #777;
}
.section-archive .game-card {
    opacity: 0.5;
    border-color: #1a1a1a;
}
.section-archive .game-card:hover {
    opacity: 1;
}

.section-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1rem;
}

.game-card {
    display: block;
    min-width: 0;
    color: inherit;
    text-decoration: none;
    border: 2px solid #222;
    background: #161b22;
    text-align: center;
    border-radius: 6px;
    transition: transform 0.2s, border-color 0.2s, opacity 0.2s;
}

.section-featured .game-card .game-card-title {
    color: lime;
    font-weight: bold;
}

.game-card:hover {
    transform: translateY(-4px);
    border-color: #fff !important;
}

.game-card-image {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: #161b22;
}

.game-card-title {
    display: block;
    padding: 0.5rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 1.1rem;
}

@media (max-width: 600px) {
    header {
        flex-wrap: wrap;
    }
    #search {
        width: 100%;
        margin-left: 0;
        order: 3;
    }
}

<body class="bg-retro-900 text-slate-100 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-black">

    <header class="sticky top-0 z-50 bg-retro-900/90 backdrop-blur-md border-b border-emerald-500/20 shadow-lg shadow-emerald-950/20">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center shadow-lg shadow-emerald-500/30">
                    <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black tracking-wider bg-gradient-to-r from-emerald-400 via-teal-300 to-emerald-500 bg-clip-text text-transparent">NES GAMES</h1>

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("container");
            const searchInput = document.getElementById("search");
            const gameCountEl = document.getElementById("game-count");
            const loadingState = document.getElementById("loading-state");
            const emptyState = document.getElementById("empty-state");
            const loadMoreContainer = document.getElementById("load-more-container");
            const loadMoreBtn = document.getElementById("load-more-btn");

            let allGames = [];
            let filteredGames = [];
            let displayedCount = 0;
            const BATCH_SIZE = 48; // Number of cards rendered per batch for peak performance

            // Fetch and parse NES game catalog
            fetch("./nes")
                .then(response => {
                    if (!response.ok) throw new Error("Network response was not ok");
                    return response.text();
                })
                .then(data => {
                    allGames = data.split("\n")
                        .map(line => line.trim())
                        .filter(line => line !== "");
                    
                    loadingState.style.display = "none";
                    filterAndRender(searchInput.value, true);
                })
                .catch(error => {
                    console.error("Error fetching NES list:", error);
                    loadingState.innerHTML = `
                        <div class="text-rose-400 text-sm font-medium">Failed to load games list. Please ensure './nes' is accessible.</div>
                    `;
                });

            // Core filtering and batch rendering function
            function filterAndRender(query = "", reset = false) {
                const lowerQuery = query.toLowerCase().trim();
                
                if (reset) {
                    filteredGames = allGames.filter(game => game.toLowerCase().includes(lowerQuery));
                    displayedCount = 0;
                    container.innerHTML = "";
                }

                gameCountEl.textContent = `${filteredGames.length} games`;

                if (filteredGames.length === 0) {
                    emptyState.style.display = "flex";
                    loadMoreContainer.style.display = "none";
                    return;
                } else {
                    emptyState.style.display = "none";
                }

                const nextBatch = filteredGames.slice(displayedCount, displayedCount + BATCH_SIZE);
                if (nextBatch.length === 0) return;

                const fragment = document.createDocumentFragment();

                nextBatch.forEach((game, index) => {
                    const gameCard = document.createElement("a");
                    // Exact URL structure preserved as requested
                    gameCard.href = `/retro.html?core=autodetect&rom=https://raw.githubusercontent.com/sigmiliarity/retro1/refs/heads/main/${encodeURIComponent(game)}`;
                    gameCard.target = "_blank";
                    gameCard.rel = "noopener noreferrer";
                    
                    gameCard.className = "group relative bg-retro-800/60 hover:bg-retro-800 border border-emerald-500/10 hover:border-emerald-500/50 rounded-2xl p-4 transition-all duration-200 flex items-center gap-3.5 shadow-lg shadow-black/20 hover:shadow-emerald-950/50 hover:-translate-y-0.5";

                    // Game Card Thumbnail / Icon badge
                    const iconBox = document.createElement("div");
                    iconBox.className = "w-10 h-10 rounded-xl bg-retro-900 border border-emerald-500/20 group-hover:border-emerald-400/50 flex items-center justify-center text-emerald-400 shrink-0 transition-colors shadow-inner";
                    iconBox.innerHTML = `
                        <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path>
                        </svg>
                    `;

                    // Game Title display
                    const titleSpan = document.createElement("span");
                    titleSpan.className = "text-sm font-medium text-slate-200 group-hover:text-emerald-300 transition-colors line-clamp-2 leading-snug";
                    // Clean up file extensions like .nes or .zip if present for cleaner titles, while keeping exact original string as backup
                    const cleanTitle = game.replace(/\.[^/.]+$/, "");
                    titleSpan.textContent = cleanTitle;

                    gameCard.appendChild(iconBox);
                    gameCard.appendChild(titleSpan);
                    fragment.appendChild(gameCard);
                });

                container.appendChild(fragment);
                displayedCount += nextBatch.length;

                // Toggle 'Load More' button visibility
                if (displayedCount < filteredGames.length) {
                    loadMoreContainer.style.display = "block";
                } else {
                    loadMoreContainer.style.display = "none";
                }
            }

            // Debounce mechanism for high-performance search input handling
            let searchTimeout;
            searchInput.addEventListener("input", (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    filterAndRender(e.target.value, true);
                }, 150);
            });

            // Load more button event listener
            loadMoreBtn.addEventListener("click", () => {
                filterAndRender(searchInput.value, false);
            });
        });
    </script>
</body>
    <script>const CATEGORIES = [
    { key: "featured", title: "Featured" },
    { key: "default", title: "Games" },
    { key: "archive", title: "Archive (Unsupported)" }
];

async function loadCatalog() {
    const entries = await Promise.all(
        CATEGORIES.map(async ({ key, title }) => {
            try {
                const response = await fetch(`/data/${key}.json`);
                if (!response.ok) return [key, title, []];
                const data = await response.json();
                const sorted = data.sort((a, b) => a[0].localeCompare(b[0]));
                return [key, title, sorted];
            } catch {
                return [key, title, []];
            }
        })
    );
    return entries; // Returns map of [key, title, games[]]
}

function loadUI(catalog) {
    const container = document.getElementById("container");
    const template = document.getElementById("game-template");

    function render(filteredCatalog) {
        container.replaceChildren();

        for (const [key, title, games] of filteredCatalog) {
            if (games.length === 0) continue;

            const section = document.createElement("section");
            section.className = `catalog-section section-${key}`;

            const heading = document.createElement("h2");
            heading.className = "section-heading";
            heading.textContent = title;
            section.appendChild(heading);

            const grid = document.createElement("div");
            grid.className = "section-grid";

            const fragment = document.createDocumentFragment();
            for (const [gameTitle, url, image] of games) {
                const card = template.content.cloneNode(true);
                const link = card.querySelector(".game-card");
                link.href = url;
                link.title = gameTitle;

                const img = card.querySelector(".game-card-image");
                img.src = image;
                img.alt = gameTitle;

                card.querySelector(".game-card-title").textContent = gameTitle;

                fragment.append(card);
            }

            grid.append(fragment);
            section.append(grid);
            container.append(section);
        }
    }

    render(catalog);

    return {
        filter(searchTerm) {
            if (!searchTerm) {
                render(catalog);
                return;
            }

            const filtered = catalog.map(([key, title, games]) => {
                const matched = games.filter(([gameTitle]) =>
                    gameTitle.toLowerCase().includes(searchTerm)
                );
                return [key, title, matched];
            });

            render(filtered);
        }
    };
}

function setupSearch(ui) {
    const searchInput = document.getElementById("search");

    searchInput.addEventListener("input", () => {
        ui.filter(searchInput.value.trim().toLowerCase());
    });

    window.addEventListener("keydown", (e) => {
        if (e.key === "/" && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
            e.preventDefault();
            searchInput.focus();
        }
        if (e.key === "Escape") {
            searchInput.value = "";
            ui.filter("");
            searchInput.blur();
        }
    });
}

const catalog = await loadCatalog();

console.log(catalog);

const ui = loadUI(catalog);
setupSearch(ui);</script>
